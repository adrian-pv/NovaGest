# DES-9 a DES-12 — Imagen, despliegue a pruebas, producción con aprobación y rollback.
#
# No reemplaza a ci.yml (pruebas con Testcontainers): arranca CUANDO ci.yml termina en verde
# en un push a develop o main.
#
#   push a develop + CI verde -> construye imagen -> GHCR -> escaneo -> despliegue a pruebas (8081)
#                                + compila el frontend -> imagen novagest-frontend:<misma etiqueta> -> tramites-ctl
#                                  lo publica en /var/www/novagest/staging cuando el backend quedó UP
#   push a main    + CI verde -> busca la imagen YA probada de ese mismo código -> aprobación -> producción (8080)
#   manual (Run workflow)     -> rollback o status en cualquier entorno
#
# La etiqueta de la imagen es el hash del ÁRBOL de archivos, no del commit: si main tiene el mismo
# código que pasó por develop, a producción va la misma imagen probada. Si main trae algo que nunca
# pasó por develop, falla en vez de desplegarlo.
#
# Nota: GitHub solo dispara workflow_run con la versión de este archivo que está en la rama por defecto.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      action:
        description: Acción
        type: choice
        options: [status, rollback]
      environment:
        description: Entorno
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || inputs.environment }}
  cancel-in-progress: false

jobs:
  # ---------- develop -> pruebas ----------
  build:
    name: Construir y publicar imagen
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: meta
        name: Calcular nombre y etiqueta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/novagest" >> "$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse --short=12 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      # Frontend: se verifica y compila ANTES de publicar nada; si falla, no sube ni el backend.
      # VITE_API_BASE_URL vacío = mismo origen (Nginx manda /api al backend). Sin archivos .env*: todo lo
      # VITE_ queda visible en el navegador, así que el build solo usa lo que está en este paso.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compilar y probar el frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ''
        run: |
          extra="$(git ls-files -- '.env*' | grep -vx '.env.example' || true)"
          if [ -n "$extra" ]; then
            echo "::error::Hay archivos .env en frontend/ dentro del repositorio; el build no los debe usar."
            exit 1
          fi
          npm ci
          npm run lint
          npm test
          npm run build
          test -s dist/index.html
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # La imagen se sube primero con una etiqueta de cuarentena ("<tag>-sin-escanear"), se escanea por su
      # digest exacto y solo si pasa se le pone la etiqueta definitiva en el registro (mismo digest, sin
      # volver a subir capas). tramites-ctl solo acepta etiquetas hexadecimales, así que la de cuarentena
      # nunca se puede desplegar. (Antes: load + docker push, que GHCR rechazaba con "unknown blob".)
      - name: Construir con el Dockerfile del backend y subir a cuarentena
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}-sin-escanear
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Escanear la imagen (CRITICAL con parche disponible)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Publicar con la etiqueta definitiva (solo si pasó el escaneo)
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools create -t "$IMAGE:$TAG" "$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest.Digest}}'
      # Solo archivos estáticos (FROM scratch): misma etiqueta que el backend, así tramites-ctl
      # publica el frontend que corresponde a ese mismo código.
      - name: Publicar el frontend en GHCR
        uses: docker/build-push-action@v6
        with:
          context: frontend/dist
          file: deploy/adrian/frontend.Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.image }}-frontend:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy-staging:
    name: Desplegar en pruebas
    needs: build
    uses: ./.github/workflows/remote.yml
    with:
      environment: staging
      command: deploy staging ${{ needs.build.outputs.tag }}
      ref: ${{ needs.build.outputs.sha }}
      send-compose: true
      smoke: true
    secrets: inherit

  # ---------- main -> producción ----------
  resolve-production:
    name: Buscar la imagen probada
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/novagest" >> "$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse --short=12 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verificar que esta versión pasó por pruebas
        env:
          REF: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
        run: |
          if ! docker buildx imagetools inspect "$REF" >/dev/null 2>&1; then
            echo "::error::No existe $REF: el código de main no es idéntico a nada que haya pasado por develop. Hagan merge de develop a main sin cambios extra."
            exit 1
          fi
          echo "Se desplegará $REF"
      - name: Volver a escanear antes de producción
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  deploy-production:
    name: Desplegar en producción
    needs: resolve-production
    uses: ./.github/workflows/remote.yml
    with:
      environment: production      # "Required reviewers" en este environment = aprobación manual
      command: deploy production ${{ needs.resolve-production.outputs.tag }}
      ref: ${{ github.event.workflow_run.head_sha }}
      send-compose: true
    secrets: inherit

  # ---------- manual: rollback / status ----------
  manual:
    name: Manual (status / rollback)
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/remote.yml
    with:
      environment: ${{ inputs.environment }}
      command: ${{ inputs.action }} ${{ inputs.environment }}
      ref: ${{ github.sha }}
    secrets: inherit
