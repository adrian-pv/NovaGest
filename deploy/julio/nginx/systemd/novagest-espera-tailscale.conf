# Drop-in para nginx.service. Los sitios privados escuchan en la IP de
# Tailscale; si Nginx arranca antes de que exista, falla el bind (ya en el
# "nginx -t" previo) y caen tambien los demas sitios del servidor.
#
# - La espera debe ir ANTES del "nginx -t" de la unidad: "ExecStartPre=" vacio
#   borra la lista original y se vuelve a declarar en orden.
# - Espera hasta 90 s a la IPv4 de tailscale0 sin bloquear el arranque.
# - Si aun asi falla, systemd reintenta cada 10 s sin limite hasta que la IP exista.
# "$$" es el escape de systemd para un "$" literal.
[Unit]
After=tailscaled.service
Wants=tailscaled.service
StartLimitIntervalSec=0

[Service]
ExecStartPre=
ExecStartPre=-/bin/sh -c 'for i in $$(seq 90); do ip -4 -o addr show dev tailscale0 2>/dev/null | grep -q " inet " && exit 0; sleep 1; done; echo "tailscale0 sin IPv4 tras 90 s" >&2; exit 0'
ExecStartPre=/usr/sbin/nginx -t -q -g 'daemon on; master_process on;'
Restart=on-failure
RestartSec=10s
