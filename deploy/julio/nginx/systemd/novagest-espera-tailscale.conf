# Drop-in para nginx.service. Los sitios privados escuchan en la IP de
# Tailscale; con net.ipv4.ip_nonlocal_bind=1 (sysctl/60-novagest-nonlocal-bind.conf)
# Nginx puede abrir ese puerto aunque la IP todavía no exista, así que el
# arranque ya no espera a Tailscale ni a internet: el resto de sitios del
# servidor levanta de inmediato.
#
# Respaldo: si aun así fallara, systemd reintenta cada 10 s sin límite.
# (Antes había una espera de hasta 90 s por la IP; el 23/10 sin internet causó
# 15 min sin Nginx tras el reinicio.)
[Unit]
After=tailscaled.service
Wants=tailscaled.service
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=10s
