# Drop-in para nginx.service. Los sitios privados escuchan en la IP de
# Tailscale; si Nginx arranca antes de que exista, falla el bind y caen
# tambien los demas sitios. Espera hasta 60 s a la IP sin bloquear el arranque.
# "$$" es el escape de systemd para un "$" literal.
[Unit]
After=tailscaled.service
Wants=tailscaled.service

[Service]
ExecStartPre=-/bin/sh -c 'for i in $$(seq 60); do ip -4 -o addr show dev tailscale0 2>/dev/null | grep -q " inet " && exit 0; sleep 1; done; echo "tailscale0 sin IPv4 tras 60 s" >&2; exit 0'
