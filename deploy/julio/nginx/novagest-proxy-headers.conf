# Fragmento para incluir dentro de cada location que use proxy_pass.
# El backend usa el RemoteIpValve de Tomcat (FORWARD_HEADERS=native y
# PROXIES_CONFIANZA con la puerta de enlace de la red Docker del entorno).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Nginx es el primer proxy: se reemplaza el valor del cliente para no confiar en un XFF recibido.
proxy_set_header X-Forwarded-For $remote_addr;
# Cada server fija $novagest_proto: $scheme en el acceso privado, https en el origen del tunel.
proxy_set_header X-Forwarded-Proto $novagest_proto;
proxy_set_header X-Forwarded-Host $host;
# Sin el puerto, con un puerto propio (8082/8083) el backend rechaza los POST
# del navegador con 403 "Invalid CORS request". Cada server fija $novagest_port:
# $server_port en el acceso privado, 443 en el origen del tunel y en HTTPS.
proxy_set_header X-Forwarded-Port $novagest_port;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
