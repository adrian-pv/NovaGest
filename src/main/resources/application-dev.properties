# Desarrollo local: valores por defecto para host, puerto y base; usuario y clave siempre desde .env
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:novagest}
logging.level.org.flywaydb=info
# Tarjeta 24: datos de demostracion solo en dev (db/dev). La clave demo llega por DEMO_PASSWORD.
spring.flyway.locations=classpath:db/migration,classpath:db/dev
# Entre corchetes: sin ellos Spring quita el "_" de la clave y Flyway no reemplaza el placeholder.
spring.flyway.placeholders[demo_password]=${DEMO_PASSWORD}

# Tarjeta 25: el frontend de Vite en desarrollo; CORS_ORIGINS del .env lo reemplaza
app.cors.origenes-permitidos=${CORS_ORIGINS:http://localhost:5173}
