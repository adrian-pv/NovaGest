spring.application.name=NovaGest

# Perfil por defecto en local; en otros entornos se elige con SPRING_PROFILES_ACTIVE (dev, test, prod)
spring.profiles.default=dev

# Lee el archivo .env de la raiz si existe (nunca se sube; ver .env.example)
spring.config.import=optional:file:.env[.properties]

# Conexion solo por variables de entorno
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# El esquema cambia solo con migraciones de Flyway (RNF-03)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Tokens: la clave sale de JWT_SECRET (minimo 32 caracteres) y nunca se escribe aqui
app.jwt.secret=${JWT_SECRET}
app.jwt.access-minutes=15
app.jwt.refresh-days=7

# RNF-07: Spring imprime el valor rechazado de cada campo invalido; asi una clave corta saldria en el log.
# Se baja ese registro a ERROR. La tarjeta 4 (errores) debe evitar valores rechazados en sus propios logs.
logging.level.org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver=ERROR

# Tarjeta 5: salud y documentacion
# Solo se expone /actuator/health, sin detalles (no revela base, disco ni versiones a quien no inicio sesion)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=false
springdoc.show-actuator=false

# Pagos: carpeta de comprobantes (variable COMPROBANTES_DIR) y limite de tamano de archivo
app.pagos.directorio=${COMPROBANTES_DIR:comprobantes}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Bloqueo por intentos fallidos de inicio de sesion (plan: 5 fallos seguidos bloquean la cuenta 15 minutos)
app.login.max-intentos=5
app.login.bloqueo-minutos=15

# Tarjeta 21: tarea diaria que guarda el tipo de cambio de todas las monedas (lunes a viernes, hora de Guatemala)
app.divisas.tarea-diaria.habilitada=true
app.divisas.tarea-diaria.cron=0 15 8 * * MON-FRI

# Tarjeta 25: origenes del navegador autorizados (separados por coma). Vacio = sin CORS (mismo origen)
app.cors.origenes-permitidos=${CORS_ORIGINS:}

# Tarjeta 26: HSTS en segundos (1 ano). 0 = no enviar. Solo se envia en respuestas HTTPS
app.seguridad.hsts-segundos=31536000

# Tarjeta 27: limite de peticiones por direccion IP en operaciones publicas (max peticiones por ventana)
app.limite.habilitado=true
app.limite.login.max=30
app.limite.login.ventana=1m
app.limite.registro.max=10
app.limite.registro.ventana=1h
app.limite.refresh.max=60
app.limite.refresh.ventana=1m

# Tarjeta 45: la API detras de un proxy (Nginx). Por defecto las cabeceras X-Forwarded-* se IGNORAN.
# Detras de un proxy: FORWARD_HEADERS=native y PROXIES_CONFIANZA=<regex de las direcciones del proxy>.
# Ver ConfiguracionDeProxy y el README (Despliegue detras de Nginx).
server.forward-headers-strategy=${FORWARD_HEADERS:none}
server.tomcat.remoteip.internal-proxies=${PROXIES_CONFIANZA:}
