# Levanta la app y la base con un solo comando: docker compose up --build
# Los valores salen del archivo .env (copiar de .env.example); ninguno se escribe aqui.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-novagest}
      POSTGRES_USER: ${DB_USER:?Falta DB_USER en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-novagest}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-}
      COMPROBANTES_DIR: /data/comprobantes
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "8080:8080"
    volumes:
      - comprobantes:/data/comprobantes

volumes:
  pgdata:
  comprobantes:
